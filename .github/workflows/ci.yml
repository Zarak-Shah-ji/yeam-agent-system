name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: TypeScript + Lint + Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No version pin: action-setup reads `packageManager` from package.json, so
      # CI runs the pnpm the lockfile was written with. It was pinned to 9 while
      # the project moved to 10, and pnpm 9 rejects this repo's
      # pnpm-workspace.yaml ("packages field missing or empty") — every run since
      # 2026-09-14 died at install, so no check below ever ran.
      - uses: pnpm/action-setup@v4

      # Matches the Vercel project's runtime (nodeVersion 24.x).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      # The suite existed for months and never ran here, so a change could break
      # all of it and still go green. It needs no database: every test covers a
      # pure function or parses a fixture from samples/.
      - name: Test
        run: pnpm test
